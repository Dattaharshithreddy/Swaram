name: Mobile APK

# Builds the Swaram Android app on GitHub's servers, so no laptop or Android
# Studio is needed. The APK appears under Releases -> "Swaram mobile (latest)".

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-apk.yml"

permissions:
  contents: write

concurrency:
  group: mobile-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: mobile/android
        env:
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
        # Signed with the debug key from the Expo template: fine for
        # installing directly, not for the Play Store (use EAS for that).
        run: |
          set -o pipefail
          if ! ./gradlew assembleRelease --no-daemon 2>&1 | tee gradle.log; then
            # Surface the cause as annotations so it shows on the run page
            # (and through the API) without opening the full log.
            grep -E "What went wrong|^e: |error:|Could not|FAILED|> " gradle.log | grep -v "^> Task.*UP-TO-DATE\|^> Task.*NO-SOURCE\|^> Configure" | head -40 \
              | while IFS= read -r line; do echo "::error title=Gradle::${line}"; done
            exit 1
          fi

      - name: Name the APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk swaram-latest.apk
          ls -l swaram-latest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: swaram-apk
          path: mobile/swaram-latest.apk

      - name: Publish to the "mobile-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: Swaram mobile (latest)
          prerelease: true
          make_latest: false
          body: |
            Android app built from ${{ github.sha }}.
            Download the .apk on your phone, open it, and allow "install unknown apps" when asked.
            Then open Swaram → Settings and enter your server URL and API key (see deploy/README.md).
          files: mobile/swaram-latest.apk
          overwrite_files: true
