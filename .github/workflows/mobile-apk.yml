name: Mobile APK

# Builds the Swaram Android app on GitHub's servers, so no laptop or Android
# Studio is needed. The APK appears under Releases -> "Swaram mobile (latest)".

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-apk.yml"

permissions:
  contents: write

concurrency:
  group: mobile-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: mobile/android
        env:
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
        # 64-bit ARM (every phone from the last several years) plus x86_64
        # for the emulator test; about half the time of all four.
        # Signed with the debug key from the Expo template: fine for
        # installing directly, not for the Play Store (use EAS for that).
        run: |
          set -o pipefail
          if ! ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64 2>&1 | tee gradle.log; then
            # Surface the cause as annotations so it shows on the run page
            # (and through the API) without opening the full log.
            # GitHub keeps only 10 annotations per step, so send one message
            # with the "What went wrong" block and compiler errors in it.
            { awk '/What went wrong/{p=1} /\* Try:/{p=0} p' gradle.log
              grep -E "^e: |error:|FAILED" gradle.log | grep -v "^> Task.*UP-TO-DATE"; } \
              | head -60 | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g' > summary.txt
            echo "::error title=Gradle build failed::$(cat summary.txt)"
            exit 1
          fi

      - name: Name the APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk swaram-latest.apk
          ls -l swaram-latest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: swaram-apk
          path: mobile/swaram-latest.apk

  # Runs the app's offline engine end to end on an Android emulator, so a
  # build that crashes never reaches a phone.
  emulator:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: swaram-apk
          path: mobile
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Self test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 6144M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: mobile
          script: ./scripts/emulator-selftest.sh swaram-latest.apk xnnpack

  publish:
    needs: [apk, emulator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: swaram-apk
          path: mobile

      - name: Publish to the "mobile-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: Swaram mobile (latest)
          prerelease: true
          make_latest: false
          body: |
            Android app built from ${{ github.sha }}.
            Download the .apk on your phone, open it, and allow "install unknown apps" when asked.
            Then open Swaram → Settings and enter your server URL and API key (see deploy/README.md).
          files: mobile/swaram-latest.apk
          overwrite_files: true
