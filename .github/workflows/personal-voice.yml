name: Personal voice pipeline

# Checks the Kaggle notebook's steps on a CPU with the real models: the big
# model (IndicF5) makes a few sentences, Piper's Telugu voice is fine-tuned
# for a few steps, and the result is packed for the app. The tiny test pack
# is published to the "personal-voice-test" release for the app's emulator
# self test (it sounds like noise; it only proves the plumbing).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "personal-voice/**"
      - ".github/workflows/personal-voice.yml"

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PYTHONPATH: ${{ github.workspace }}/IndicF5:${{ github.workspace }}/edge
      WORK: ${{ github.workspace }}/work
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q x-transformers torchdiffeq vocos==0.1.0 einops jieba pypinyin ema-pytorch onnx onnxruntime pathvalidate \
            safetensors huggingface_hub librosa soundfile datasets \
            'lightning>=2,<3' 'jsonargparse[signatures]>=4.27.7' tensorboardX 'pysilero-vad>=2.1,<3' 'cython>=3,<4'
          git clone -q --depth 1 https://github.com/AI4Bharat/IndicF5.git IndicF5
          git clone -q https://github.com/OHF-Voice/piper1-gpl.git piper
          cd piper && git checkout -q $(python -c "import re;print(re.search(r'PIPER_COMMIT = \"(\w+)\"', open('../personal-voice/make_notebook.py').read()).group(1))")
          bash build_monotonic_align.sh
      - name: Phonemizer matches the golden file (the app checks the same file)
        working-directory: personal-voice
        run: |
          python -c "
          import json; from telugu_ipa import phonemize
          g = json.load(open('tests/golden.json'))
          bad = [x for x in g if phonemize(x['text']) != x['phonemes']]
          assert not bad, bad
          print(len(g), 'golden cases match')"
      - name: Emotion tokens match the app
        run: |
          python - <<'PY'
          import re, sys
          sys.path.insert(0, "personal-voice")
          from emotions import TOKENS
          ts = open("mobile/src/edge/emotions.ts", encoding="utf-8").read()
          block = ts[ts.index("EMOTION_TOKENS"):]
          app = dict(re.findall(r"(\w+): '(.)'", block))
          assert app == TOKENS, (app, TOKENS)
          print(len(TOKENS), "emotion tokens match")
          PY
      - name: Notebook is up to date
        working-directory: personal-voice
        run: python make_notebook.py && git diff --exit-code swaram_personal_voice.ipynb
      - name: Generate a few sentences with IndicF5 (CPU)
        working-directory: personal-voice
        run: |
          mkdir -p $WORK
          cp ../IndicF5/prompts/PAN_F_HAPPY_00001.wav $WORK/ref.wav
          python make_sentences.py $WORK/data 6
          set -o pipefail
          python generate.py --ref $WORK/ref.wav \
            --ref-text "ਭਹੰਪੀ ਵਿੱਚ ਸਮਾਰਕਾਂ ਦੇ ਭਵਨ ਨਿਰਮਾਣ ਕਲਾ ਦੇ ਵੇਰਵੇ ਗੁੰਝਲਦਾਰ ਅਤੇ ਹੈਰਾਨ ਕਰਨ ਵਾਲੇ ਹਨ, ਜੋ ਮੈਨੂੰ ਖੁਸ਼ ਕਰਦੇ  ਹਨ।" \
            --out $WORK/data --steps 8 --batch 3
          python dataset.py $WORK/data
      - name: Fine-tune Piper's Telugu voice for a few steps
        working-directory: personal-voice
        run: |
          set -o pipefail
          if ! python train.py --data $WORK/data --piper ../piper --out $WORK/train --batch 2 --max-steps 3 --cpu > $WORK/train.log 2>&1; then
            grep -v Warning $WORK/train.log | tail -40
            echo "::error title=Training failed::$(grep -v -i warn $WORK/train.log | tail -25 | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g')"
            exit 1
          fi
          grep -v Warning $WORK/train.log | tail -15
      - name: Package for the app
        working-directory: personal-voice
        run: |
          set -o pipefail
          python package.py --train $WORK/train --piper ../piper --name "CI test" --data $WORK/data --min-emotion-lines 1 --out $WORK/output 2>&1 | tee $WORK/package.txt
          grep -q '"happy"' $WORK/output/voice.json || { echo "::error::voice.json has no emotions"; exit 1; }
          echo "::notice title=Personal voice pipeline::$(tail -5 $WORK/package.txt | tr '\n' ' ')"
      - uses: actions/upload-artifact@v4
        with:
          name: personal-voice-test
          path: |
            ${{ env.WORK }}/output/samples
            ${{ env.WORK }}/data/wav
      - name: Publish the test pack for the app's emulator test
        uses: softprops/action-gh-release@v2
        with:
          tag_name: personal-voice-test
          name: Personal voice test pack (CI)
          prerelease: true
          make_latest: false
          body: A few-step test model from the personal voice pipeline. Not a usable voice.
          files: ${{ env.WORK }}/output/swaram-voice-CI-test.zip
          overwrite_files: true
