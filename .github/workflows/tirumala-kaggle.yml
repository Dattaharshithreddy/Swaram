name: Tirumala reel render (Kaggle)

# Renders the Tirumala guest-house reel frames on Kaggle's free GPU (up to 12 h per session, good for overnight).
# Frames land in the HF bucket HarshithReddy05/tirumala-reel. Settings: render/tirumala.json. Runs on push to
# this branch when that file changes, or by hand.

on:
  workflow_dispatch:
  push:
    branches: [render/tirumala]
    paths: [render/tirumala.json]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start the render on Kaggle
        working-directory: mobile
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set +e
          node --experimental-strip-types scripts/tirumala-kaggle.ts > out.txt 2>&1
          code=$?
          level=notice; [ $code -ne 0 ] && level=error
          echo "::$level title=Kaggle render::$(grep -v -e Warning -e trace-warnings -e Reparsing -e 'type\": \"module' out.txt | tail -20 | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g')"
          exit $code
      - name: Encrypted hand-off of fetched files (key from the private bucket)
        if: hashFiles('mobile/render-out/fetch/**') != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q huggingface_hub
          python3 -c "from huggingface_hub import HfApi;HfApi().sync_bucket('hf://buckets/HarshithReddy05/tirumala-reel/keys','/tmp/keys',quiet=True)"
          cd mobile/render-out && tar czf /tmp/fetch.tgz fetch && openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/fetch.tgz -out /tmp/fetch.tgz.enc -pass file:/tmp/keys/asset.key && rm -rf /tmp/keys
          cd $GITHUB_WORKSPACE && git config user.name swaram-bot && git config user.email actions@users.noreply.github.com
          git checkout -q --orphan fetch-tmp && git rm -rf -q . && cp /tmp/fetch.tgz.enc . && git add fetch.tgz.enc && git commit -q -m "encrypted fetch" && git push -q -f origin HEAD:kaggle-fetch
