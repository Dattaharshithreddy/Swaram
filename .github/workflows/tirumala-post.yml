name: Tirumala reel finish (voice, music, Telugu captions)

# Pulls the rendered frames and narration from the private HF bucket, adds the temple music and the Telugu overlay
# (skillvideo reels/tirumala-stay/hf/post_job.sh) and puts the final MP4 back in the bucket under final/.
on:
  workflow_dispatch:
  push:
    branches: [render/tirumala]
    paths: [render/post.json]

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Get the reel project and the rendered frames
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone -q --depth 1 -b reels/follow-the-sugar https://github.com/Dattaharshithreddy/skillvideo /tmp/sv
          sudo mkdir -p /out && sudo chown $USER /out
          pip install -q -U huggingface_hub
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN']); B = 'hf://buckets/HarshithReddy05/tirumala-reel'
          for sub, src in (('seq', 'seq2'), ('audio', 'audio'), ('kaggle_meta', 'gha_meta')):
              os.makedirs('/out/' + sub, exist_ok=True); api.sync_bucket(f'{B}/{src}', '/out/' + sub, quiet=True)
          print({s: len(os.listdir('/out/' + s)) for s in ('seq', 'audio', 'kaggle_meta')})
          PY
          cp /out/kaggle_meta/timing.json /out/kaggle_meta/labels.json /out/
      - name: Mix and add the Telugu overlay
        run: |
          sed -i 's/--concurrency=8/--concurrency=4/; /^apt-get/ s/apt-get /sudo apt-get /g' /tmp/sv/reels/tirumala-stay/hf/post_job.sh
          bash /tmp/sv/reels/tirumala-stay/hf/post_job.sh > post.txt 2>&1; code=$?
          echo "::notice title=Finish::$(grep -v '^+' post.txt | tail -15 | tr '\n' '\r' | sed 's/\r/%0A/g')"
          exit $code
      - name: Put the final video in the bucket
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python3 -c "import os;from huggingface_hub import HfApi;HfApi(token=os.environ['HF_TOKEN']).sync_bucket('/out/final','hf://buckets/HarshithReddy05/tirumala-reel/final',quiet=True);print(os.listdir('/out/final'))"
      - name: Hand the video to Claude (encrypted, so the voice never sits readable in this public repo)
        run: |
          cd /out/final && openssl rand -hex 32 > /tmp/k.txt
          for f in tirumala_guesthouses_telugu.mp4 final_sheet.jpg; do openssl enc -aes-256-cbc -pbkdf2 -salt -in $f -out /tmp/$f.enc -pass file:/tmp/k.txt; done
          openssl pkeyutl -encrypt -pubin -inkey $GITHUB_WORKSPACE/mobile/scripts/tirumala_pub.pem -in /tmp/k.txt -out /tmp/k.enc && rm /tmp/k.txt
          cd $GITHUB_WORKSPACE && git config user.name "swaram-bot" && git config user.email "actions@users.noreply.github.com"
          git checkout -q --orphan tirumala-final-tmp && git rm -rf -q . && cp /tmp/*.enc . && git add *.enc
          git commit -q -m "encrypted final reel $(date -u +%FT%TZ)" && git push -q -f origin HEAD:tirumala-final
