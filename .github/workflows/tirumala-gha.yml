name: Tirumala reel render on GitHub runners (CPU)

# Backup renderer that needs no Kaggle: each job renders one slice of the reel with Cycles on the runner's CPU and
# puts the frames in the HF bucket (seq/). render/gha.json: { "slices": N, "only": [..], "spp": S, "test": bool }.
on:
  push:
    branches: [render/tirumala]
    paths: [render/gha.json]

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      slices: ${{ steps.p.outputs.slices }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: python3 -c "import json;c=json.load(open('render/gha.json'));n=c['slices'];o=c.get('only') or list(range(1,n+1));print('slices='+json.dumps(o))" >> $GITHUB_OUTPUT
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        slice: ${{ fromJson(needs.plan.outputs.slices) }}
    steps:
      - uses: actions/checkout@v4
      - name: Render slice ${{ matrix.slice }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          N=$(python3 -c "import json;print(json.load(open('render/gha.json'))['slices'])")
          SPP=$(python3 -c "import json;print(json.load(open('render/gha.json')).get('spp',48))")
          TEST=$(python3 -c "import json;print(int(bool(json.load(open('render/gha.json')).get('test'))))")
          sudo mkdir -p /out && sudo chown $USER /out
          pip install -q -U huggingface_hub
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN']); B = 'hf://buckets/HarshithReddy05/tirumala-reel'
          for s in ('mf', 'audio'):
              os.makedirs('/out/' + s, exist_ok=True); api.sync_bucket(f'{B}/{s}', '/out/' + s, include=['*.glb', '*.wav'], quiet=True)
          print({s: len(os.listdir('/out/' + s)) for s in ('mf', 'audio')})
          PY
          git clone -q --depth 1 -b reels/follow-the-sugar https://github.com/Dattaharshithreddy/skillvideo /tmp/sv
          J=/tmp/sv/reels/tirumala-stay/hf/render_job.sh
          sed -i '/^apt-get/ s/apt-get /sudo apt-get /g' $J
          sudo mkdir -p /opt/reel && sudo chown -R $USER /opt/reel
          # CPU: Cycles on all cores; test mode renders 3 frames to time it
          sed -i "s/for dt in ('OPTIX', 'CUDA'):/for dt in ():/" /tmp/sv/reels/tirumala-stay/hf/cycles_hq.py
          if [ "$TEST" = 1 ]; then export TAG=gha_test FRAMES=1201,1202,1203; else export TAG=seq START=part${{ matrix.slice }}of$N; fi
          export SPP
          (while sleep 240; do python3 -c "import os;from huggingface_hub import HfApi;HfApi(token=os.environ['HF_TOKEN']).sync_bucket('/out/$TAG','hf://buckets/HarshithReddy05/tirumala-reel/$TAG',quiet=True)" 2>/dev/null; done) &
          time bash $J 2>&1 | grep -E "Saved|rror|frames |RENDER_JOB|Time:|CYCLES" | tail -40 | tee r.txt
          python3 -c "import os;from huggingface_hub import HfApi;HfApi(token=os.environ['HF_TOKEN']).sync_bucket('/out/$TAG','hf://buckets/HarshithReddy05/tirumala-reel/$TAG',quiet=True)"
          echo "::notice title=Slice ${{ matrix.slice }}::$(tail -12 r.txt | tr '\n' '\r' | sed 's/\r/%0A/g')"
