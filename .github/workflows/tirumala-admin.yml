name: Tirumala render admin

# Makes sure the bucket's seq/ folder exists (so a resuming render never waits on an empty folder) and deletes
# stuck render notebooks on Kaggle named in render/admin.json.
on:
  push:
    branches: [render/tirumala]
    paths: [render/admin.json]

jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Seed seq/ and free Kaggle slots
        working-directory: mobile
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q -U huggingface_hub
          mkdir -p /tmp/seed && echo keep > /tmp/seed/_keep.txt
          python3 -c "import os;from huggingface_hub import HfApi;HfApi(token=os.environ['HF_TOKEN']).sync_bucket('/tmp/seed','hf://buckets/HarshithReddy05/tirumala-reel/seq',quiet=True);print('seeded')" > a.txt 2>&1
          node --experimental-strip-types scripts/tirumala-admin.ts >> a.txt 2>&1
          echo "::notice title=Admin::$(grep -v -i -e warning -e reparsing -e trace a.txt | tail -10 | tr '\n' '\r' | sed 's/\r/%0A/g')"
