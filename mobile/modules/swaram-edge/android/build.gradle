plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.swaramedge'
version = '0.1.0'

android {
  namespace "expo.modules.swaramedge"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles "proguard-rules.pro"
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  // Official ONNX Runtime for Android (CPU, XNNPACK and NNAPI providers).
  implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.24.3'
}
